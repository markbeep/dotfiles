#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# Note: user name/email defined in conf.d/user.toml
# [user]
# name = "<name>"
# email = "main@email.com"

# [[--scope]]
# --when.repositories = ["~/Documents/Subdir1", "~/Documents/Subdir2"]
# [--scope.user]
# name = "<name>"
# email = "other@email.com"

[ui]
default-command = "log"
diff-editor = ":builtin"

[aliases]
e = ["edit"]
f = ["git", "fetch"]
difft = ["diff", "--config", 'ui.diff-formatter=["difft", "--color=always", "$left", "$right"]']

[revsets]
bookmark-advance-to = '@-'
